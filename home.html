<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZecTV - Reproductor M3U</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #e4e7e9;
            padding: 1rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .card {
            background: #1c1e1f;
            border-radius: 8px;
            padding: 1rem;
            width: calc(50% - 1rem);
            text-align: left;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.9rem;
            color: #ccc;
        }

        .play-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #e4e7e9;
            cursor: pointer;
        }

        .video-player {
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
        }

        .video-player video {
            width: 100%;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .card {
                width: calc(100% - 1rem);
            }
        }
    </style>
</head>

<body>
    <h1>ZecTV - Lista de Películas</h1>
    <div class="container" id="movie-list">
        <!-- Las tarjetas se generan dinámicamente aquí -->
    </div>

    <div class="video-player" id="video-player" style="display: none;">
        <video controls id="video" src=""></video>
    </div>

    <script>
        // Ejemplo de contenido de un archivo M3U parseado (esto normalmente vendría de un archivo real)
        const m3uContent = `
#EXTM3U
#EXTINF:-1, Película 1
https://example.com/movie1.mp4
#EXTINF:-1, Película 2
https://example.com/movie2.mp4
#EXTINF:-1, Película 3
https://example.com/movie3.mp4
        `;

        // Parsear el contenido M3U y generar tarjetas
        function parseM3U(content) {
            const lines = content.split('\n');
            const movies = [];
            let currentMovie = {};

            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    currentMovie = {};
                    currentMovie.name = line.split(',')[1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentMovie.url = line.trim();
                    movies.push(currentMovie);
                }
            });

            return movies;
        }

        function generateCards(movies) {
            const container = document.getElementById('movie-list');
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="https://via.placeholder.com/1080x720?text=${encodeURIComponent(movie.name)}" alt="${movie.name}">
                    <h2>${movie.name}</h2>
                    <p>Descripción de la película ${movie.name}...</p>
                    <div class="play-icon">▶️</div>
                `;
                card.addEventListener('click', () => playMovie(movie.url));
                container.appendChild(card);
            });
        }

        function playMovie(url) {
            const videoPlayer = document.getElementById('video-player');
            const video = document.getElementById('video');
            video.src = url;
            videoPlayer.style.display = 'block';
            video.play();
        }

        // Parsear el archivo M3U y generar las tarjetas
        const movies = parseM3U(m3uContent);
        generateCards(movies);
    </script>
</body>

</html>
