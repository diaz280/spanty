<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZecTV - Lista de Películas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 2rem 0;
            font-size: 2.5rem;
            color: #111;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            padding: 0 1rem;
        }

        .card {
            position: relative;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .card .card-content {
            padding: 0.5rem;
        }

        .card h2 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
            color: #333;
        }

        .card p {
            font-size: 0.9rem;
            color: #666;
            margin: 0;
        }

        .card .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 1rem;
            text-align: center;
        }

        .card:hover .overlay {
            opacity: 1;
        }

        .overlay h2 {
            font-size: 1.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #111;
        }

        .modal-content p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .play-button, .back-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #ff5722;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
            margin: 0.5rem 0;
        }

        .play-button:hover, .back-button:hover {
            background: #e64a19;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .video-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .video-modal-content {
            background: #1f1f1f;
            border-radius: 8px;
            max-width: 90%;
            width: 100%;
            position: relative;
        }

        .video-modal video {
            width: 100%;
            border-radius: 8px;
        }

        .video-back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #fff;
        }

        @media (max-width: 768px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>ZecTV - Lista de Películas</h1>
    <div class="container" id="movie-list">
        <!-- Las tarjetas se generan dinámicamente aquí -->
    </div>

    <!-- Modal para Información de la Película -->
    <div class="modal" id="info-modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal('info-modal')">&times;</span>
            <img id="modal-movie-image" src="" alt="Imagen de la película">
            <h2 id="modal-movie-title">Título de la Película</h2>
            <p id="modal-movie-description">Descripción de la película...</p>
            <button class="play-button" onclick="openVideoModal()">▶️ Reproducir</button>
        </div>
    </div>

    <!-- Modal para el Reproductor de Video -->
    <div class="video-modal" id="video-modal">
        <div class="video-modal-content">
            <span class="video-back-button" onclick="backToInfoModal()">&larr;</span>
            <video controls id="video-player"></video>
        </div>
    </div>

    <script>
        // Ejemplo de contenido de un archivo M3U parseado (esto normalmente vendría de un archivo real)
        const m3uContent = `
#EXTM3U
#EXTINF:-1, Película 1
https://example.com/movie1.mp4
#EXTINF:-1, Película 2
https://example.com/movie2.mp4
#EXTINF:-1, Película 3
https://example.com/movie3.mp4
        `;

        // Parsear el contenido M3U y generar tarjetas
        function parseM3U(content) {
            const lines = content.split('\n');
            const movies = [];
            let currentMovie = {};

            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    currentMovie = {};
                    currentMovie.name = line.split(',')[1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentMovie.url = line.trim();
                    movies.push(currentMovie);
                }
            });

            return movies;
        }

        function generateCards(movies) {
            const container = document.getElementById('movie-list');
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="https://via.placeholder.com/250x140?text=${encodeURIComponent(movie.name)}" alt="${movie.name}">
                    <div class="card-content">
                        <h2>${movie.name}</h2>
                    </div>
                    <div class="overlay">
                        <h2>${movie.name}</h2>
                        <p>Haz clic para más información</p>
                    </div>
                `;
                card.addEventListener('click', () => openInfoModal(movie));
                container.appendChild(card);
            });
        }

        function openInfoModal(movie) {
            // Aquí puedes agregar la lógica para buscar la descripción automáticamente
            document.getElementById('modal-movie-image').src = `https://via.placeholder.com/800x600?text=${encodeURIComponent(movie.name)}`;
            document.getElementById('modal-movie-title').innerText = movie.name;
            document.getElementById('modal-movie-description').innerText = `Descripción ficticia de ${movie.name}.`;
            document.getElementById('info-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openVideoModal() {
            document.getElementById('info-modal').style.display = 'none';
            document.getElementById('video-modal').style.display = 'flex';
            document.getElementById('video-player').src = 'https://example.com/movie1.mp4'; // Asignar URL del video
            document.getElementById('video-player').play();
        }

        function backToInfoModal() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('info-modal').style.display = 'flex';
        }

        // Parsear el archivo M3U y generar las tarjetas
        const movies = parseM3U(m3uContent);
        generateCards(movies);
    </script>
</body>

</html>
