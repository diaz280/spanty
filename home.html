<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inteligente Avanzado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #141E30, #243B55);
            color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            position: relative;
            animation: pulse 3s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 255, 255, 0.8);
            }
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #00e1ff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        #inputArea {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #00e1ff;
            border-radius: 10px;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ffc8;
            background: rgba(255, 255, 255, 0.3);
        }

        button {
            padding: 10px 25px;
            font-size: 1.1em;
            background: linear-gradient(45deg, #00e1ff, #00ffc8);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transition: background 0.3s, transform 0.3s;
        }

        button:hover {
            background: linear-gradient(45deg, #00ffc8, #00e1ff);
            transform: scale(1.05);
        }

        #response {
            margin-top: 20px;
            font-size: 1.2em;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        .hud {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            text-align: right;
        }

        .hud span {
            display: block;
            margin-bottom: 5px;
        }

        .hidden-tools {
            background: rgba(0, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            margin-top: 30px;
            text-align: left;
            width: 100%;
        }

        .hidden-tools h2 {
            margin-bottom: 10px;
            color: #00ffc8;
            font-size: 1.5em;
            cursor: pointer;
        }

        .tool-options {
            display: none;
            margin-top: 10px;
        }

        .tool-options .option {
            background: rgba(0, 255, 255, 0.2);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tool-options .option:hover {
            background: rgba(0, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Sistema Inteligente</h1>
        <div class="hud">
            <span>Estado: Operativo</span>
            <span>Conexión: Estable</span>
            <span>Nivel de energía: 85%</span>
        </div>
        <div id="inputArea">
            <input type="text" id="userInput" placeholder="Escribe tu comando...">
            <br>
            <button onclick="processInput()">Enviar</button>
        </div>
        <div id="response"></div>

        <div class="hidden-tools">
            <h2 onclick="toggleTools()">Funciones Avanzadas</h2>
            <div class="tool-options">
                <div class="option" onclick="accessTool('Análisis de datos')">
                    Análisis de datos
                </div>
                <div class="option" onclick="accessTool('Control de acceso remoto')">
                    Control de acceso remoto
                </div>
                <div class="option" onclick="accessTool('Monitoreo de seguridad')">
                    Monitoreo de seguridad
                </div>
                <div class="option" onclick="accessTool('Supervisión de redes')">
                    Supervisión de redes
                </div>
            </div>
        </div>
    </div>

    <script>
        function processInput() {
            const userInput = document.getElementById('userInput').value.trim();
            const response = document.getElementById('response');

            if (userInput.toLowerCase().includes('hola')) {
                response.innerText = "¡Saludos! ¿En qué puedo ayudarte hoy?";
            } else if (userInput.toLowerCase().includes('recomendación')) {
                response.innerText = "Te sugiero la película 'El Gran Despertar'. Una excelente opción de ciencia ficción.";
            } else if (userInput.toLowerCase().includes('sistema')) {
                response.innerText = "El sistema está operativo y listo para ejecutar comandos avanzados.";
            } else {
                response.innerText = "Procesando... no se ha detectado un comando válido.";
            }

            document.getElementById('userInput').value = '';
        }

        function toggleTools() {
            const tools = document.querySelector('.tool-options');
            tools.style.display = tools.style.display === 'none' || tools.style.display === '' ? 'block' : 'none';
        }

        function accessTool(toolName) {
            const response = document.getElementById('response');
            response.innerText = `Accediendo a la función: ${toolName}...`;
        }
    </script>
</body>

</html>
