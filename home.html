<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inteligente - Película Futurista</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #101820;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #inputArea {
            margin: 20px 0;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        input[type="text"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #007ACC;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005F99;
        }
        #response {
            margin-top: 20px;
            font-size: 1.2em;
            color: #00FF00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema Inteligente</h1>
        <div id="inputArea">
            <input type="text" id="userInput" placeholder="Escribe aquí...">
            <br>
            <button onclick="processInput()">Enviar</button>
        </div>
        <div id="response"></div>
    </div>

    <script>
        function processInput() {
            const userInput = document.getElementById('userInput').value;
            const response = document.getElementById('response');

            if (userInput.toLowerCase().includes('hola')) {
                response.innerText = "¡Hola! ¿En qué puedo ayudarte hoy?";
            } else if (userInput.toLowerCase().includes('recomendación')) {
                response.innerText = "Te recomiendo la película 'Inception'. ¡Es una obra maestra!";
            } else {
                response.innerText = "Estoy analizando tu solicitud...";
            }

            // Limpiar el input
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
