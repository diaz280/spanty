<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Inteligente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .chat-box {
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        .chat-message {
            margin-bottom: 15px;
        }

        .chat-message.user {
            text-align: right;
        }

        .chat-message.user p {
            background: #d1f7c4;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .chat-message.bot p {
            background: #e1e1e1;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            border: none;
            border-radius: 0 0 0 10px;
            outline: none;
        }

        button {
            width: 20%;
            border: none;
            background: #007bff;
            color: white;
            font-size: 1.1em;
            border-radius: 0 0 10px 0;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="chat-message bot">
                <p>¡Hola! Soy tu asistente. ¿En qué puedo ayudarte hoy?</p>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const responses = {
            'hola': '¡Hola! ¿Cómo puedo ayudarte?',
            'tu nombre': 'Soy un chatbot creado para asistirte.',
            'gracias': '¡De nada! ¿Hay algo más en lo que pueda ayudarte?'
        };

        function sendMessage() {
            const userInput = document.getElementById('userInput').value.trim().toLowerCase();
            const chatBox = document.getElementById('chatBox');

            if (userInput === '') return;

            // Mostrar mensaje del usuario
            chatBox.innerHTML += `
                <div class="chat-message user">
                    <p>${userInput}</p>
                </div>
            `;

            // Mostrar respuesta del chatbot
            let responseText = responses[userInput];
            if (!responseText) {
                responseText = 'Lo siento, no sé la respuesta. ¿Te gustaría que la guardara?';
                // Guardar la pregunta si el usuario lo desea
                setTimeout(() => {
                    const saveResponse = confirm('¿Quieres guardar esta pregunta y respuesta?');
                    if (saveResponse) {
                        const userResponse = prompt('Escribe la respuesta para esta pregunta:');
                        if (userResponse) {
                            responses[userInput] = userResponse;
                            alert('La pregunta y respuesta se han guardado.');
                        }
                    }
                }, 1000);
            }

            chatBox.innerHTML += `
                <div class="chat-message bot">
                    <p>${responseText}</p>
                </div>
            `;

            // Desplazar hacia abajo el chat
            chatBox.scrollTop = chatBox.scrollHeight;

            // Limpiar el campo de entrada
            document.getElementById('userInput').value = '';
        }
    </script>
</body>

</html>
