<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Industries Interface</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #0d0d0d;
            color: #00e6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 80%;
            height: 80%;
            border: 2px solid #00e6e6;
            padding: 20px;
            position: relative;
            box-shadow: 0px 0px 20px #00e6e6;
        }

        .header {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 20px;
        }

        .module {
            background: rgba(0, 230, 230, 0.1);
            padding: 20px;
            border: 1px solid #00e6e6;
            box-shadow: 0px 0px 10px #00e6e6;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .module:hover {
            background: rgba(0, 230, 230, 0.2);
            transform: scale(1.05);
            box-shadow: 0px 0px 20px #00e6e6;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Stark Industries Advanced System</div>
        <div class="grid">
            <div class="module">Module 1</div>
            <div class="module">Module 2</div>
            <div class="module">Module 3</div>
            <div class="module">Module 4</div>
            <div class="module">Module 5</div>
            <div class="module">Module 6</div>
        </div>
        <div class="footer">Powered by J.A.R.V.I.S</div>
    </div>
</body>
</html>
