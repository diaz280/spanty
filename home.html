<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZecTV - Lista de Películas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 2rem 0;
            font-size: 2.5rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            padding: 0 1rem;
        }

        .card {
            position: relative;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2rem;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        .modal-info {
            max-width: 600px;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
        }

        .modal-info h2 {
            margin-top: 0;
            font-size: 2rem;
        }

        .modal-info p {
            margin-bottom: 2rem;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        .play-button {
            display: inline-block;
            font-size: 2rem;
            color: #ff5722;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 87, 34, 0.2);
            backdrop-filter: blur(8px);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .play-button:hover {
            background: rgba(255, 87, 34, 0.3);
            transform: scale(1.05);
        }

        .video-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .video-modal-content {
            width: 90%;
            max-width: 800px;
            position: relative;
            background: #000;
            border-radius: 8px;
        }

        .video-modal video {
            width: 100%;
            border-radius: 8px;
        }

        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 2rem;
            cursor: pointer;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <h1>ZecTV - Lista de Películas</h1>
    <div class="container" id="movie-list">
        <!-- Las tarjetas se generan dinámicamente aquí -->
    </div>

    <!-- Modal de Información -->
    <div class="modal" id="info-modal">
        <div class="modal-content" id="modal-background">
            <div class="modal-info">
                <h2 id="modal-movie-title">Título de la Película</h2>
                <p id="modal-movie-description">Descripción de la película. Aquí va una breve sinopsis de la película para dar contexto al espectador.</p>
                <div class="play-button" onclick="openVideoModal()">▶</div>
            </div>
        </div>
    </div>

    <!-- Modal del Reproductor de Video -->
    <div class="video-modal" id="video-modal">
        <div class="video-modal-content">
            <span class="back-button" onclick="backToInfoModal()">←</span>
            <video controls id="video-player"></video>
        </div>
    </div>

    <script>
        const m3uContent = `
#EXTM3U
#EXTINF:-1, Película 1
https://example.com/movie1.mp4
#EXTINF:-1, Película 2
https://example.com/movie2.mp4
#EXTINF:-1, Película 3
https://example.com/movie3.mp4
        `;

        function parseM3U(content) {
            const lines = content.split('\n');
            const movies = [];
            let currentMovie = {};

            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    currentMovie = {};
                    currentMovie.name = line.split(',')[1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentMovie.url = line.trim();
                    movies.push(currentMovie);
                }
            });

            return movies;
        }

        function generateCards(movies) {
            const container = document.getElementById('movie-list');
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="https://via.placeholder.com/250x140?text=${encodeURIComponent(movie.name)}" alt="${movie.name}">
                `;
                card.addEventListener('click', () => openInfoModal(movie));
                container.appendChild(card);
            });
        }

        function openInfoModal(movie) {
            document.getElementById('modal-background').style.backgroundImage = `url('https://via.placeholder.com/1000x600?text=${encodeURIComponent(movie.name)}')`;
            document.getElementById('modal-movie-title').innerText = movie.name;
            document.getElementById('modal-movie-description').innerText = `Descripción ficticia de ${movie.name}.`;
            document.getElementById('info-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openVideoModal() {
            document.getElementById('info-modal').style.display = 'none';
            document.getElementById('video-modal').style.display = 'flex';
            document.getElementById('video-player').src = 'https://example.com/movie1.mp4'; // Asignar URL del video
            document.getElementById('video-player').play();
        }

        function backToInfoModal() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('info-modal').style.display = 'flex';
        }

        const movies = parseM3U(m3uContent);
        generateCards(movies);
    </script>
</body>

</html>
