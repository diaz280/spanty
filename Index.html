<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            overflow: hidden;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideIn 1.2s ease forwards;
            opacity: 0;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: white;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.2);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #ccc;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 1rem;
            font-size: 0.75rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 0.25rem;
            border-radius: 3px;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: linear-gradient(45deg, #5a0db2, #1e65e6);
        }

        .links {
            margin-top: 1rem;
        }

        .links a {
            text-decoration: none;
            color: #ccc;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            margin: 0 0.5rem;
        }

        .links a:hover {
            color: #fff;
        }

        @keyframes slideIn {
            0% {
                transform: translateY(-50px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" required placeholder=" ">
                <label>Usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label>Contraseña</label>
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        <div class="links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">Regístrate aquí</a>
        </div>
    </div>

    <script>
        // Simulando la lectura de un archivo de texto
        // Imaginemos que el archivo de texto contiene el usuario y contraseña de esta manera:
        // Usuario: dia0540d
        // Contraseña: dia0540d

        // Creamos una variable que simula el contenido de ese archivo de texto
        const simulatedFileContent = `
Usuario: dia0540d
Contraseña: dia0540d
`;

        // Función para extraer los datos del "archivo" simulado
        function getCredentialsFromFile(content) {
            const lines = content.trim().split("\n");
            const username = lines[0].split(": ")[1];
            const password = lines[1].split(": ")[1];
            return { username, password };
        }

        // Obtenemos las credenciales simuladas
        const credentials = getCredentialsFromFile(simulatedFileContent);

        // Capturamos el formulario
        const form = document.getElementById("login-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevenir que el formulario se envíe

            // Obtener valores ingresados por el usuario
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Verificar si coinciden con las credenciales simuladas
            if (username === credentials.username && password === credentials.password) {
                alert("Inicio de sesión exitoso. ¡Bienvenido!");
                // Aquí puedes redirigir al usuario o realizar alguna acción
            } else {
                alert("Usuario o contraseña incorrectos. Inténtalo nuevamente.");
            }
        });
    </script>
</body>

</html>
