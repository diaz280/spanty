        <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            overflow: hidden;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideIn 1.2s ease forwards;
            opacity: 0;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: white;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.2);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #ccc;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 1rem;
            font-size: 0.75rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 0.25rem;
            border-radius: 3px;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: linear-gradient(45deg, #5a0db2, #1e65e6);
        }

        .links {
            margin-top: 1rem;
        }

        .links a {
            text-decoration: none;
            color: #ccc;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            margin: 0 0.5rem;
        }

        .links a:hover {
            color: #fff;
        }

        @keyframes slideIn {
            0% {
                transform: translateY(-50px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Estilos para la ventana modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 300px;
            border-radius: 10px;
            text-align: center;
        }

        .close-btn {
            background-color: #6a11cb;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" required placeholder=" ">
                <label>Usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label>Contraseña</label>
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        <div class="links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">Regístrate aquí</a>
        </div>
    </div>

    <!-- Ventana Modal para credenciales incorrectas -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <p>Usuario o contraseña incorrectos. Inténtalo nuevamente.</p>
            <button class="close-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <!-- Importamos el archivo de credenciales -->
    <script src="credentials.js"></script>
    <script>
        // Capturamos el formulario
        const form = document.getElementById("login-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevenir que el formulario se envíe

            // Obtener valores ingresados por el usuario
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Verificar si coinciden con las credenciales importadas desde el archivo credentials.js
            if (username === credentials.username && password === credentials.password) {
                // Redirigir a la página home.html si las credenciales son correctas
                window.location.href = "home.html";
            } else {
                // Mostrar la ventana modal si las credenciales son incorrectas
                document.getElementById('errorModal').style.display = 'block';
            }
        });

        // Función para cerrar la ventana modal
        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
        }
    </script>
</body>

</html>
